name: XiangTailiang's OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  #REPO_URL: https://github.com/openwrt/openwrt
  REPO_URL: https://github.com/xiangtailiang/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # ===== 下面是新增的 Ccache 极速命中参数 =====
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler dos2unix fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 1. 必须先用 apt 安装系统级的 ccache 工具！
    - name: Install Ccache host tool
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache

    # 2. 设置环境变量与缓存目录
    - name: Set global Ccache env
      run: |
        mkdir -p ~/.ccache
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        
    # 3. 恢复/保存 Actions 缓存
    - name: Cache Ccache Files
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-openwrt-ccache-v2-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-v2-

    # 4. 在 Actions 恢复完毕后，再初始化 ccache 参数！
    - name: Init Ccache Config
      run: |
        ccache -M 5G
        ccache -o compression=true
        ccache -z

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    
    - name: Clean feeds
      run: |
        cd openwrt
        #rm -rf feeds
        ./scripts/feeds clean 2>/dev/null || true
        rm -rf feeds package/feeds
        
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        
        # 强制将 Ccache 开关写入 OpenWrt 配置
        sed -i '/CONFIG_CCACHE/d' .config
        echo "CONFIG_CCACHE=y" >> .config    
        
        for pkg in \
          airoha-en7581-npu-firmware \
          luci-app-airoha-npu \
          luci-i18n-airoha-npu-zh-cn \
          vlmcsd \
          luci-app-vlmcsd \
          luci-i18n-vlmcsd-zh-cn
        do
          sed -i "s/# CONFIG_PACKAGE_${pkg} is not set/CONFIG_PACKAGE_${pkg}=y/" .config 2>/dev/null || true
          grep -q "CONFIG_PACKAGE_${pkg}=y" .config || echo "CONFIG_PACKAGE_${pkg}=y" >> .config
        done
        
        echo ">>> 验证强制结果："
        grep -E "CONFIG_PACKAGE_(airoha-en7581-npu-firmware|luci-app-airoha-npu|vlmcsd|luci-app-vlmcsd)=y" .config || echo "⚠️ 仍有包未选中"
        
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Debug Check Custom Changes
      run: |
        cd openwrt
    
        echo "========== 1. .config 关键包是否选中 =========="
        grep -E "CONFIG_PACKAGE_(airoha-en7581-npu-firmware|luci-app-airoha-npu|luci-i18n-airoha-npu|vlmcsd|luci-app-vlmcsd)=y" .config || echo "⚠️ 以上包有缺失"
    
        echo ""
        echo "========== 2. package/ 目录是否有 luci-app-airoha-npu =========="
        if [ -d "package/luci-app-airoha-npu" ]; then
          echo "✔ package/luci-app-airoha-npu 存在"
          ls package/luci-app-airoha-npu/
        else
          echo "❌ package/luci-app-airoha-npu 不存在！clone 失败"
        fi
    
        echo ""
        echo "========== 3. feeds 里是否有 vlmcsd =========="
        find feeds -type d -name "*vlmcsd*" 2>/dev/null || echo "❌ feeds 里找不到 vlmcsd"
    
        echo ""
        echo "========== 4. 最终确认关键 CONFIG 行 =========="
        grep -n "airoha-npu\|vlmcsd\|airoha-en7581-npu" .config || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt

        # 1. 显式指定全局 Ccache 目录与配置
        export CCACHE_DIR=$HOME/.ccache
        export CCACHE_COMPILERCHECK=content
        
        # 2. 强行把系统的 ccache 注入到 OpenWrt 的 PATH 最前端
        mkdir -p staging_dir/host/bin
        ln -sf /usr/bin/ccache staging_dir/host/bin/ccache 2>/dev/null || true
        
        # 3. 开启 BUILD_LOG=1 记录编译时间与日志
        echo -e "$(nproc) thread compile"
        make -j$(nproc) CCACHE_DIR=$HOME/.ccache BUILD_LOG=1 || make -j1 CCACHE_DIR=$HOME/.ccache BUILD_LOG=1 || make -j1 V=s BUILD_LOG=1
        
        # 4. 打印编译完成后的缓存统计
        echo "========== Ccache Hit Rate =========="
        ccache -s
        echo "===================================="
        
        # 5. 统计并打印每个 Package 的编译耗时排行榜 (Top 30)
        echo "=================================================="
        echo "          📦 各 Package 编译耗时排行榜 (Top 30)    "
        echo "=================================================="
        if [ -d "logs" ]; then
          find logs/ -name "*.log" -exec grep -H "duration" {} + 2>/dev/null | \
          awk -F':' '{
            split($1, path_parts, "/");
            pkg_name = path_parts[length(path_parts)-1];
            duration = $NF;
            gsub(/[^0-9]/, "", duration);
            if (duration != "") printf "%-35s %d 秒 (%d 分 %d 秒)\n", pkg_name, duration, duration/60, duration%60;
          }' | \
          sort -k2 -nr | \
          head -n 30
        else
          echo "未找到 logs 目录"
        fi
        echo "=================================================="

        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check Ccache Stats
      run: |
        ccache -s
        
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        # 1. 进入 OpenWrt 官方唯一的标准产物输出目录
        cd openwrt/bin/targets/*/*
        
        # 2. 清理仅用于本地 opkg 的 packages 目录
        rm -rf packages

        # 3. 创建 Release 临时目录
        mkdir -p /tmp/release_files

        # 4. 【OpenWrt 标准过滤】只提取具备发布和烧写意义的文件
        # 包含：sysupgrade 固件、FIT 内核镜像(itb)、Factory/UBI 刷机包(img)、 Bootloader 镜像(fip/bl2/u-boot) 及构建信息
        for file in *; do
          if [[ "$file" =~ \.(bin|itb|img|manifest|buildinfo)$ ]] || \
             [[ "$file" =~ (u-boot|fip|bl2|chainload) ]]; then
            
            # 过滤掉体积庞大且不能直接用于烧写的 rootfs 压缩包
            if [[ "$file" != *"rootfs"* ]]; then
              cp -f "$file" /tmp/release_files/
            fi
          fi
        done

        # 5. 打印标准打包清单（包含文件大小）
        echo "================ OpenWrt Standard Release Artifacts ================"
        ls -lh /tmp/release_files/
        echo "===================================================================="

        echo "FIRMWARE=/tmp/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 5

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
