name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler dos2unix fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
      
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # --------------------------------------------------------------------------
    # 2. 注入 UBI 强开启配置，并修改平台 Makefile
    # --------------------------------------------------------------------------
    - name: Enable UBI and Customize Image Generation
      run: |
        cd openwrt
        # 在加载完基础 .config 后追加 UBI 强开启参数
        cat <<EOF >> .config
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_ROOTFS_UBIFS=y
        CONFIG_TARGET_ROOTFS_UBI=y
        EOF

        # 定位 AN7581 打包 Makefile
        MK_FILE=$(find target/linux/airoha/ -name "an7581.mk" -o -name "image.mk" | head -n 1)
        if [ -f "$MK_FILE" ]; then
          echo "修改平台配置文件: $MK_FILE"
          
          # 兼容匹配 IMAGES := 或 IMAGES +=，同时输出 sysupgrade.bin 和 ubi.img
          sed -i '/Device\/nokia_xg-040g-md/,/endef/s/IMAGES [:+]=.*/IMAGES := sysupgrade.bin ubi.img/' "$MK_FILE"
          
          # 动态插入 SUPPORTED_DEVICES，确保 Web 升级校验时不报错
          if ! grep -q "nokia,xg-040g-md-ubi" "$MK_FILE"; then
            sed -i '/define Device\/nokia_xg-040g-md/a \  SUPPORTED_DEVICES := nokia,xg-040g-md nokia,xg-040g-md-ubi' "$MK_FILE"
          fi
        fi

        # 修复 patches 换行符，防止 malformed patch 报错
        find target/linux/airoha/ -name "*.patch" -exec dos2unix {} + 2>/dev/null || true
        
    - name: Create fit_check_image link rule
      run: |
        cd openwrt
        mkdir -p files/usr/bin
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-fix-fit-check
        #!/bin/sh
        if [ ! -e /usr/bin/fit_check_image ] && [ -x /usr/bin/fit-check-image ]; then
            ln -s /usr/bin/fit-check-image /usr/bin/fit_check_image
        fi
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-fix-fit-check

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        # 确保 make defconfig 跑完后 UBI 强开启配置不被抹除
        echo "CONFIG_TARGET_ROOTFS_UBI=y" >> .config
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Debug Check Custom Changes
      run: |
        cd openwrt
        echo "=== 检查 .config 是否包含自定义包 ==="
        grep -E "vlmcsd|lm-sensors|wakeonlan|airoha" .config || true
        
        echo "=== 检查 Makefile 或 Patch 是否保留了你的修改 ==="
        git status
        git diff target/linux/airoha/
        
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages

        # 自动从 68M sysupgrade.bin 提取 raw 镜像并转成 .itb
        echo "=== 正在处理 Sysupgrade 镜像提取 ITB ==="
        for bin_file in *sysupgrade.bin; do
          if [ -f "$bin_file" ]; then
            # 1. 解压提取出原始 12.9M 的 raw FIT 镜像
            zcat "$bin_file" > raw_fit.bin 2>/dev/null || true
            
            # 2. 如果解压成功，重命名生成同名的 .itb 文件
            if [ -s raw_fit.bin ]; then
              itb_name="${bin_file%.sysupgrade.bin}.itb"
              mv raw_fit.bin "$itb_name"
              echo "成功生成 ITB 镜像: $itb_name"
            fi
          fi
        done
        
        # 1. 创建统一提取临时目录
        mkdir -p /tmp/release_files

        # 2. 复制所有固件（增加了 *.img 保证抓取 ubi.img）
        cp -f *.bin /tmp/release_files/ 2>/dev/null || true
        cp -f *.img /tmp/release_files/ 2>/dev/null || true
        cp -f *.tar.gz /tmp/release_files/ 2>/dev/null || true
        cp -f *.itb /tmp/release_files/ 2>/dev/null || true
        cp -f *.manifest /tmp/release_files/ 2>/dev/null || true
        cp -f *.buildinfo /tmp/release_files/ 2>/dev/null || true

        # 3. 从 staging_dir 抓取 AN7581 的 U-Boot / FIP / BL2 镜像
        echo "正在提取单独的 U-Boot/FIP 文件..."
        find /workdir/openwrt/staging_dir/target-*/image/ -type f \( -name "*u-boot*" -o -name "*fip*" -o -name "*bl2*" -o -name "*chainload*" \) -exec cp -f {} /tmp/release_files/ \; 2>/dev/null || true

        # 4. 兜底逻辑
        if [ -z "$(ls -A /tmp/release_files)" ]; then
          cp -f * /tmp/release_files/ 2>/dev/null || true
        fi

        echo "FIRMWARE=/tmp/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT        

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 5

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
